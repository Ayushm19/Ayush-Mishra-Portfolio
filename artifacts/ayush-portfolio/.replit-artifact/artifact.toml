kind = "web"
previewPath = "/"
title = "Ayush Mishra Portfolio"
description = "A playful, editorial portfolio for Ayush Mishra, featuring selected engineering work, AI systems experience, and an interactive terminal that answers questions about his background."
version = "1.0.0"
id = "artifacts/ayush-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20065

[services.development]
run = "pnpm --filter @workspace/ayush-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20065"
BASE_PATH = "/"
